<title>A Wizard's Way</title>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap"></noscript>
<style>
/* Layout: one column, search bar pinned near the top; results list drops under it; chosen dispensary opens as a single card. Built for a driver glancing at a phone. */
:root{
  --bg:#eef3f8; --surface:#ffffff; --fg:#0b2233; --muted:#4d6478; --line:#cbd8e4; --hover:#e3eef8;
  --accent:#0c5488; --accent-fg:#ffffff; --purple:#582064; --wbg:#582064; --wfg:#ffffff;
  --ok:#17803a; --ok-bg:#dff3e4; --no:#b3261e; --no-bg:#fbe3e0; --warn:#9a5b00; --warn-bg:#fdecc8;
  --g-solid:#177a38; --r-solid:#b3261e; --o-solid:#a15f00;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#082434; --surface:#0c3048; --fg:#e8f1f8; --muted:#9bb6cc; --line:#174a6e; --hover:#11405f;
  --accent:#5db0ea; --accent-fg:#04202f; --purple:#c79ad6; --wbg:#c79ad6; --wfg:#1c0b24;
  --ok:#6fdc8c; --ok-bg:#183a24; --no:#ff8a80; --no-bg:#42201d; --warn:#ffc34d; --warn-bg:#40300c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#082434; --surface:#0c3048; --fg:#e8f1f8; --muted:#9bb6cc; --line:#174a6e; --hover:#11405f;
  --accent:#5db0ea; --accent-fg:#04202f; --purple:#c79ad6; --wbg:#c79ad6; --wfg:#1c0b24;
  --ok:#6fdc8c; --ok-bg:#183a24; --no:#ff8a80; --no-bg:#42201d; --warn:#ffc34d; --warn-bg:#40300c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.mark{position:fixed;left:50%;top:50%;translate:-50% -50%;width:min(86.4vw,456px);opacity:.3;pointer-events:none;user-select:none;z-index:0}
main{position:relative;z-index:1}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.35;padding-inline:16px;padding-block:20px 40px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.field{position:relative}
.field svg{position:absolute;left:16px;top:50%;translate:0 -50%;width:24px;height:24px;color:var(--muted);pointer-events:none}
#q{width:100%;height:64px;padding:0 48px 0 52px;font:500 22px var(--f-body);color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:12px;outline:none}
#q:focus{border-color:var(--purple)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
#q::placeholder{color:var(--muted);font-weight:400}
#clear{position:absolute;right:6px;top:50%;translate:0 -50%;width:48px;height:48px;border:0;background:none;color:var(--muted);font-size:28px;cursor:pointer;border-radius:10px}
#clear:focus-visible,.row:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
li:first-child .row{border-top:0}
.row[aria-selected="true"],.row:hover{background:var(--hover)}
.row .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.row .ct{color:var(--muted);font-size:15px}
mark{background:none;color:var(--purple);font-weight:700}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.dot.g{background:var(--ok)}.dot.r{background:var(--no)}.dot.o{background:var(--warn)}
.empty{padding:18px 16px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.card h1{font:700 34px/1.05 var(--f-display);margin:0;text-wrap:balance;letter-spacing:.2px}
.card.g{--solid:var(--g-solid)}.card.r{--solid:var(--r-solid)}.card.o{--solid:var(--o-solid)}
.card.g,.card.r,.card.o{background:var(--solid);border-color:var(--solid);color:#fff}
.card h1{color:#fff}
.status{display:flex;flex-direction:column;gap:2px;padding:6px 0 14px;border-bottom:2px solid rgba(255,255,255,.4)}
.status b{font:700 clamp(38px,12vw,56px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.status span{font-weight:500;font-size:19px;opacity:.95}
.card dt{color:rgba(255,255,255,.85)}
.card .muted{color:rgba(255,255,255,.8)}
.addr{display:block;color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.addr small{display:block;font-weight:500;font-size:15px;text-decoration:none;opacity:.9;margin-top:2px}
.card .btn{background:#fff;color:var(--solid);border-color:#fff}
.card .btn.alt{background:none;color:#fff}
.card #x{display:none}
dl{margin:0;display:grid;gap:14px}
dt{font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
dd{margin:0;font-size:20px;overflow-wrap:anywhere}
dd.num{font-variant-numeric:tabular-nums;letter-spacing:.3px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 16px;border-radius:12px;font:600 19px var(--f-body);text-decoration:none;background:var(--accent);color:var(--accent-fg);border:2px solid var(--accent)}
.btn.alt{background:none;color:var(--accent)}
.muted{color:var(--muted)}
main{min-height:calc(100dvh - 60px)}
.link{background:none;border:0;color:var(--purple);font:600 18px var(--f-body);text-align:left;padding:12px 0;min-height:48px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.foot{margin-top:auto;align-self:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font:700 32px/1.05 var(--f-display);margin:0}
.sheet h3{font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -6px}
.sheet p{margin:0}
.sheet ol,.sheet ul.notes{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;background:none;border:0;border-radius:0;overflow:visible;list-style:revert}
button.btn{cursor:pointer;width:100%}
button.btn:disabled{opacity:.6;cursor:default}
.routebar{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
body.hasbar{padding-block-end:104px}
.sheet ol.stops{padding-left:0;list-style:none;gap:0}
.stop{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 16px var(--f-body);font-variant-numeric:tabular-nums}
.stop .sn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stop .sn b{font-weight:600;overflow-wrap:anywhere}
.stop .sn small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.ctl{display:flex;gap:4px;flex:none}
.ctl button,.ctl a{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:none;color:var(--fg);font:600 18px var(--f-body);cursor:pointer;text-decoration:none}
.ctl button:disabled{opacity:.35;cursor:default}
.ctl a.go{width:auto;padding:0 12px;background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-size:16px}
.ctl button:focus-visible,.ctl a:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--accent);border-radius:12px;overflow:hidden}
.seg3{grid-template-columns:repeat(3,1fr)}
.stop .sn small.ad{display:block;color:var(--fg);font-size:15px;overflow-wrap:anywhere}
.seg button{min-height:48px;border:0;background:none;color:var(--accent);font:600 17px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.legs{display:flex;flex-direction:column;gap:10px}
.sum{font-weight:600}
#splash{position:fixed;inset:0;z-index:50;background:#06141d;opacity:0;pointer-events:none;transition:opacity .6s ease}
#splash.on{opacity:1;pointer-events:auto}
#splash img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
#splash.on img{animation:splashin .7s ease both}
@keyframes splashin{from{opacity:0}to{opacity:1}}
@keyframes cardin{from{opacity:0}to{opacity:1}}
.card:not([hidden]),.sheet:not([hidden]){animation:cardin .25s ease both}
@media (prefers-reduced-motion:reduce){#splash,#splash.on img,.card:not([hidden]),.sheet:not([hidden]){transition-duration:.01s;animation-duration:.01s}}
#shareText{width:100%;font:15px/1.35 var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.warn{display:flex;gap:12px;align-items:flex-start;background:var(--wbg);color:var(--wfg);border-radius:12px;padding:14px 16px}
.warn svg{flex:none;width:30px;height:30px;margin-top:2px}
.warn b{display:block;font:700 28px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.warn span{font-weight:500;font-size:17px;line-height:1.3}

/* In-app Ohio-only navigation */
#navview{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
#navview .ban{background:var(--purple);color:var(--wfg);border-radius:10px;padding:8px 12px;font:700 15px var(--f-body);letter-spacing:.04em;text-align:center}
.turn{background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.turn .big{font:700 44px/1 var(--f-display)}
.turn .txt{font:600 22px/1.2 var(--f-body)}
.turn small{opacity:.9;font-size:15px}
.nstop{border-radius:12px;padding:10px 14px;color:#fff;font:600 18px var(--f-body)}
.nstop.g{background:var(--g-solid)}.nstop.r{background:var(--r-solid)}.nstop.o{background:var(--o-solid)}
.nmsg{border-radius:10px;padding:10px 12px;background:var(--warn-bg);color:var(--fg);font:500 16px var(--f-body)}
.nmsg.bad{background:var(--no-bg)}
</style>

function googleLegs(st,L=loc){
  const legs=[]; let prev=null;
  for(let i=0;i<st.length;i+=4){

    let u="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+enc(L(dest));
    if(prev) u+="&origin="+enc(L(prev));
    if(wps.length) u+="&waypoints="+wps.map(w=>enc(L(w))).join("%7C");
    legs.push({url:u,from:i+1,to:i+chunk.length,resume:!!prev});

  engine_error:"The route server had a problem. Try again.",
  unauthorized:"That driver code was not accepted. Ask for a new one.",
  too_many_stops:"Too many stops for one route."};
function getPos(){return new Promise(res=>{if(!navigator.geolocation) return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:10000})})}
const driverCode=()=>{try{return localStorage.getItem("ww_code")||""}catch(e){return ""}};
function codeBox(note){const m=document.getElementById("navMsg");if(!m) return;m.innerHTML=(note?esc(note)+"<br>":"Enter your driver code to use in-app navigation.<br>")+'<input id="codeIn" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Driver code" style="padding:10px;margin:6px 6px 0 0;font-size:16px;border-radius:8px;border:1px solid #888;width:10em"> <button type="button" class="btn alt" data-act="savecode" style="width:auto;display:inline-block">Save code</button>'}
async function fetchPlan(from,pts){
  const r=await fetch(NAV_URL.replace(/\/$/,"")+"/route",{method:"POST",headers:{"content-type":"application/json","x-api-key":NAV_KEY,"x-driver-code":driverCode()},body:JSON.stringify({from:from||undefined,stops:pts.map(d=>({lat:d.lat,lng:d.lng}))})});
  return r.json();
}
let navStops=[];
async function startNav(){
  const msg=document.getElementById("navMsg"), set=m=>{if(msg) msg.textContent=m};
  if(!NAV_URL||NAV_URL.startsWith("__")) return set("In-app navigation is not set up yet. Use the Google or Apple Maps buttons for now.");
  if(!navigator.onLine) return set("In-app navigation needs a signal.");
  navStops=stops();
  const miss=navStops.filter(d=>!(d.lat&&d.lng));
  if(miss.length) return set("No map point for: "+miss.map(d=>d.n).join(", ")+". Remove it or use the Maps buttons.");
  if(!navStops.length) return;
  if(!driverCode()) return codeBox();
  set("Finding an Ohio-only route…"); showSplash();
  const from=await getPos();
  let plan;
  try{plan=await fetchPlan(from,navStops)}catch(e){hideSplash();return set(NAVERR.engine_unavailable)}
  hideSplash();
  if(plan.error==="unauthorized"){try{localStorage.removeItem("ww_code")}catch(e){}return codeBox("That driver code was not accepted. Ask for a new one.")}
  if(!plan.ok) return set(NAVERR[plan.error]||"Could not make an Ohio-only route.");
  beginNav(plan,!!from);
}
function beginNav(plan,hasFrom){
  N.plan=plan;N.leg=hasFrom?0:0;N.man=0;N.off=0;N.spoken=-1;N.hasFrom=hasFrom;N.leg=0;
  loadLeg();showView("nav");
  if(!N.sim) startWatch();
  drawNav();
}
function loadLeg(){const l=N.plan.legs[N.leg];N.shape=decodePoly(l.shape);N.man=0;N.spoken=-1}
// Index of the stop the current leg is heading to.
const legStop=()=>N.hasFrom?N.leg:N.leg+1;
function startWatch(){
  if(!navigator.geolocation||N.watch!=null) return;
  N.watch=navigator.geolocation.watchPosition(p=>onPos({lat:p.coords.latitude,lng:p.coords.longitude}),()=>{N.gpsLost=true;drawNav()},{enableHighAccuracy:true,maximumAge:2000});
}
function stopNav(){
  if(N.watch!=null){navigator.geolocation.clearWatch(N.watch);N.watch=null}
  try{speechSynthesis.cancel()}catch(e){}
  N.plan=null;showView("route");
}
async function onPos(p){
  if(!N.plan) return;
  N.pos=p;N.gpsLost=false;
  const leg=N.plan.legs[N.leg], mans=leg.maneuvers;
  const near=nearest(N.shape,[p.lat,p.lng],mans[N.man]?mans[N.man].begin:0);
  // Advance past maneuvers already behind us.
  while(N.man<mans.length-1&&near.i>=mans[N.man+1].begin-1) N.man++;
  // Arrived at this leg's stop.
  const end=N.shape[N.shape.length-1];
  if(mdist(end,[p.lat,p.lng])<60){
    if(N.leg<N.plan.legs.length-1){N.leg++;loadLeg();say("Arrived. Next stop.");drawNav();return}
    say("You have arrived at your last stop.");N.done=true;drawNav();return;
  }
  // Off route -> ask for a new Ohio-only route from here.
  if(near.d>70) N.off++; else N.off=0;
  if(N.off>=2&&Date.now()-N.lastReroute>15000&&navigator.onLine) await reroute(p);
  const m=mans[N.man];
  if(m&&N.spoken!==N.man){
    const dm=mdist([p.lat,p.lng],N.shape[Math.min(m.end||0,N.shape.length-1)]);
    if(m.verbalPre&&N.man>0&&dm<400){say(m.verbalPre);N.spoken=N.man}
    else if(N.man===0&&N.spoken<0){say(m.verbalPre||m.text);N.spoken=0}
  }
  drawNav();
}
async function reroute(p){
  N.lastReroute=Date.now();N.msg="Finding a new Ohio-only route…";drawNav();
  const remaining=navStops.slice(legStop());
  try{
    const plan=await fetchPlan({lat:p.lat,lng:p.lng},remaining);
    if(!plan.ok){N.msg=NAVERR[plan.error]||"Could not reroute.";N.bad=true;say("I could not find a route that stays in Ohio. Stop when it is safe.");return}
    const done=navStops.length-remaining.length;
    N.plan=plan;N.hasFrom=true;N.leg=0;navStops=remaining;N.off=0;N.msg="";N.bad=false;loadLeg();say("New route.");
  }catch(e){N.msg=NAVERR.engine_unavailable;N.bad=true}
}
function drawNav(){
  if(!N.plan) return;
  const leg=N.plan.legs[N.leg], m=leg.maneuvers[N.man]||{}, d=navStops[legStop()-(N.hasFrom?0:0)]||navStops[navStops.length-1];
  const w=d?word(d):["",""];
  let remMi=0;for(let i=N.man;i<leg.maneuvers.length;i++) remMi+=leg.maneuvers[i].miles||0;
  const stopsLeft=N.plan.legs.length-N.leg;
  let h=`<div class="ban">STAY INSIDE OHIO</div>`;
  if(N.done) h+=`<div class="turn"><div class="big">Done</div><div class="txt">All stops finished.</div></div>`;
  else h+=`<div class="turn"><div class="big">${esc(m.street||"")||"Continue"}</div><div class="txt">${esc(m.text||"Continue")}</div><small>${fmtMi(m.miles||0)} on this step · ${fmtMi(remMi)} to the stop</small></div>
  ${d?`<div class="nstop ${w[1]}">Next stop: ${esc(d.n)} · ${w[0]}<br><small>${esc(d.a)}</small></div>`:""}`;
  if(N.msg) h+=`<div class="nmsg ${N.bad?"bad":""}">${esc(N.msg)}</div>`;
  if(N.gpsLost) h+=`<div class="nmsg bad">No GPS position. Check Location is allowed for this app.</div>`;
  h+=`<small class="muted">${stopsLeft} stop${stopsLeft===1?"":"s"} left</small>
  <button type="button" class="btn alt" data-nav="voice">Voice: ${N.voice?"on":"off"}</button>
  <button type="button" class="btn alt" data-nav="skip">Skip to next stop</button>
  <button type="button" class="btn" data-nav="end">End navigation</button>`;
  nv.innerHTML=h;
}
nv.addEventListener("click",e=>{
  const b=e.target.closest("[data-nav]");if(!b) return;
  if(b.dataset.nav==="voice"){N.voice=!N.voice;if(!N.voice)try{speechSynthesis.cancel()}catch(e){}}
  else if(b.dataset.nav==="skip"){if(N.leg<N.plan.legs.length-1){N.leg++;loadLeg()}}
  else if(b.dataset.nav==="end") return stopNav();
  drawNav();
});
// Test hook: feed fake GPS fixes (used by the automated test, harmless otherwise).
window.__navTest={N,onPos,beginNav,drawNav,decodePoly};

// ---------- Live data from the published Google Sheet ----------
// The built-in list above is the fallback. When the phone is online the app refreshes from the sheet,
// and it keeps the last good copy on the device so searching still works offline.
const SHEET_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSV8AaZrZlzbJfqRfqqMZ_AcXHYTlYYgUgEu2PTRQzIG2qOQSs5HsK4xYOrE3n-DFVnFBY_0EnB-3vA/pub?output=csv";
const CACHE_KEY="awr_sheet_csv";
function parseCSV(text){
  const rows=[]; let row=[], f="", inq=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inq){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else inq=false } else f+=c }
    else if(c==='"') inq=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(c!=="\r") f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
// Picks columns by their titles, so extra columns (checkboxes, notes) are ignored.
function fromRows(rows){
  const low=r=>r.map(x=>String(x).toLowerCase().trim());
  const h=rows.findIndex(r=>{const l=low(r);return l.some(x=>x.includes("dispensary name"))&&l.some(x=>x.includes("drop-off")||x.includes("drop off"))});
  if(h<0) return null;
  const l=low(rows[h]), at=f=>l.findIndex(f);
  const C={n:at(x=>x.includes("dispensary name")),p:at(x=>x.includes("phone")),pr:at(x=>x.includes("prompt")),a:at(x=>x==="address"||x.startsWith("address")),
           d:at(x=>x.includes("drop-off")||x.includes("drop off")),s:at(x=>x==="status"),la:at(x=>x.startsWith("latitude")||x==="lat"),lo:at(x=>x.startsWith("longitude")||x==="lng"||x==="lon")};
  if(C.n<0||C.d<0||C.s<0) return null;
  const g=(r,i)=>i>=0&&r[i]!=null?String(r[i]).trim():"";
  const out=[];
  for(const r of rows.slice(h+1)){
    const n=g(r,C.n).replace(/\s+/g," "); if(!n) continue;
    let p=g(r,C.p).replace(/\D/g,""); if(p.length===11&&p[0]==="1") p=p.slice(1); if(p.length!==10) p="";
    let a=g(r,C.a); if(a.includes("?")) a="";
    const parts=a?a.split(",").map(x=>x.trim()):[];
    const s=g(r,C.s).toLowerCase();
    let lat=parseFloat(g(r,C.la)), lng=parseFloat(g(r,C.lo));
    if(!(lat>=38.4&&lat<=42.0&&lng>=-84.9&&lng<=-80.5)){lat=null;lng=null}   // coordinates must fall inside Ohio's bounding box
    out.push({n,p,pr:g(r,C.pr),a,c:parts.length>=2?parts[parts.length-2]:"",l:"",d:g(r,C.d),k:s==="green"?"g":s==="red"?"r":"o",lat,lng});
  }
  return out.length>=50?out:null;   // a short or broken sheet never replaces the good list
}
function applyCSV(text){
  const rowsOut=fromRows(parseCSV(text)); if(!rowsOut) return false;
  DATA.length=0; rowsOut.forEach(x=>DATA.push(x)); indexData();
  route=stops().map(d=>d.n); saveRoute(); updateBar();
  if(current){const d=DATA.find(x=>x.n===current.n); if(d&&!card.hidden) show(d)}
  else if(q.value&&view==="search"&&!list_hidden()) render();
  if(view==="route") renderRoute();
  return true;
}
const list_hidden=()=>list.hidden;
const REFRESH_MS=15*60*1000;
let lastTry=0, loading=false;
async function loadSheet(){
  if(loading) return; loading=true; lastTry=Date.now();
  try{
    const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),8000);
    const res=await fetch(SHEET_CSV,{cache:"no-store",signal:ctl.signal}); clearTimeout(tm);
    if(!res.ok) return;
    const text=await res.text();
    if(applyCSV(text)){try{localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),csv:text}))}catch(e){}}
  }catch(e){}
  loading=false;
}
// Start from the copy saved on the phone, then refresh now and every 15 minutes.
try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(c&&c.csv) applyCSV(c.csv)}catch(e){}
loadSheet();
setInterval(loadSheet,REFRESH_MS);
// Phones pause timers while the app is in the background, so catch up when the driver comes back.
document.addEventListener("visibilitychange",()=>{
  if(document.hidden||Date.now()-lastTry<REFRESH_MS) return;
  showSplash();                                                           // real wait: refreshing after a long time away
  Promise.race([loadSheet(),new Promise(r=>setTimeout(r,3000))]).then(()=>hideSplash(700));
});

// ---------- Loading screen ----------
const splash=document.getElementById("splash"); let splashAt=Date.now();
function showSplash(){splashAt=Date.now(); splash.hidden=false; requestAnimationFrame(()=>splash.classList.add("on"))}
function hideSplash(min){
  if(!splash.classList.contains("on")) return;
  const wait=Math.max(0,min-(Date.now()-splashAt));
  setTimeout(()=>{splash.classList.remove("on"); setTimeout(()=>{if(!splash.classList.contains("on")) splash.hidden=true},700)},wait);
}
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
window.addEventListener("load",()=>hideSplash(calm?300:1500));
setTimeout(()=>hideSplash(0),4000);   // never leave a driver stuck on the loading screen
</script>
